image: node:24

stages:
  - install
  - build
  - pages
  - create_version
  - containerize
  - release

include:
  - remote: https://gitlab.com/TIBHannover/gitlab-ci-templates/raw/master/templates/Docker.gitlab-ci.yml

.default_rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' # ensure the pipelines also run on merge requests (prevent merging when tests are failing): https://docs.gitlab.com/ee/ci/pipelines/merge_request_pipelines.html
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

install:
  stage: install
  script:
    - npm install
  artifacts:
    paths:
      - node_modules/
  rules:
    - !reference [.default_rules, rules]

build:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - .next
  rules:
    - !reference [.default_rules, rules]

# deploy storybook to Gitlab pages
pages:
  stage: pages
  script:
    - rm -rf public # remove the currently existing 'public' folder that contains static files for running the frontend
    - mkdir -p public/storybook
    - npm run build-storybook
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH

create_version:
  stage: create_version
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
  script:
    - npm run semantic-release
  artifacts:
    paths:
      - CHANGELOG.md
      - package.json
      - package-lock.json

deploy:release:
  stage: release
  image: buildpack-deps:buster-curl
  before_script: []
  script:
    - curl --fail -X POST -F "token=$PIPELINE_TRIGGER_TOKEN" -F "ref=main" -F "variables[COMPONENT_NAME]=tib-aissistant-web-app" -F "variables[COMPONENT_RELEASE_VERSION]=$CI_COMMIT_TAG" https://git.tib.eu/api/v4/projects/2554/trigger/pipeline
  rules:
    - if: $CI_COMMIT_TAG
